name: Guard - block log/binary artifacts

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

jobs:
  check-forbidden-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if repo contains log/build artifacts
        run: |
          BAD=$(git ls-files | grep -E '\.log$|\.log\.[0-9-]+.*\.gz$|^be/logs/|^be/target/|^fe/node_modules/|^fe/dist/' || true)
          if [ -n "$BAD" ]; then
            echo "Các file sau không nên được commit (log/build artifact):"
            echo "$BAD"
            echo "Xoá khỏi repo: git rm --cached <file>, kiểm tra .gitignore."
            exit 1
          fi
          echo "OK - khong co file log/artifact la"
