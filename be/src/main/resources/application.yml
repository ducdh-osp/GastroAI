spring:
  application:
    name: be
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: 8080

app:
  datasource:
    postgres:
      url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/gastroai
      username: ${POSTGRES_USERNAME:gastroai}
      password: ${POSTGRES_PASSWORD:gastroai}
      driver-class-name: org.postgresql.Driver
    mysql:
      url: jdbc:mysql://localhost:${MYSQL_PORT:3306}/gastroai_admin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      username: ${MYSQL_USERNAME:gastroai}
      password: ${MYSQL_PASSWORD:gastroai}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32-chars-min}
    expiration-minutes: 60
  mail:
    from: ${MAIL_FROM:no-reply@gastroai.vn}
    verification-base-url: ${VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
