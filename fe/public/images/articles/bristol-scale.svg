<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bristolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="bShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#bristolBg)" />

  <rect x="24" y="16" width="672" height="40" rx="8" fill="#78350f" />
  <text x="360" y="42" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    THANG PHÂN LOẠI DẠNG PHÂN BRISTOL (BRISTOL STOOL CHART)
  </text>

  <!-- Left: Type 1, 2 (Táo bón) & Type 3, 4 (Lý tưởng) -->
  <g transform="translate(30, 68)">
    <rect width="320" height="315" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#bShadow)" />

    <!-- TYPE 1 -->
    <g transform="translate(15, 12)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 1: Viên cứng riêng biệt (Táo bón nặng)</text>
      <text x="12" y="38" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10">Như hạt dẻ, phân khô cứng, rất khó đi ngoài.</text>
      <text x="12" y="52" fill="#991b1b" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Thời gian lưu chuyển trong ruột quá lâu (thiếu nước/xơ).</text>
    </g>

    <!-- TYPE 2 -->
    <g transform="translate(15, 84)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" />
      <text x="12" y="20" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 2: Dạng xúc xích nhưng gồ ghề (Táo bón nhẹ)</text>
      <text x="12" y="38" fill="#78350f" font-family="system-ui, sans-serif" font-size="10">Nhiều cục vón lại thành khối, phân khô cứng.</text>
      <text x="12" y="52" fill="#92400e" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Cần tăng uống nước và vận động kích thích nhu động.</text>
    </g>

    <!-- TYPE 3 -->
    <g transform="translate(15, 156)">
      <rect width="290" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="12" y="20" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 3: Dạng xúc xích có vết nứt bề mặt ★</text>
      <text x="12" y="38" fill="#166534" font-family="system-ui, sans-serif" font-size="10">Khuôn phân tốt, bề mặt hơi nứt nẻ, dễ đi ngoài.</text>
      <text x="12" y="54" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">✓ Trạng thái bình thường, tiêu hóa tốt.</text>
    </g>

    <!-- TYPE 4 -->
    <g transform="translate(15, 232)">
      <rect width="290" height="70" rx="6" fill="#ecfdf5" stroke="#34d399" stroke-width="2" />
      <text x="12" y="20" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 4: Xúc xích hoặc con rắn, mềm mịn ★★★</text>
      <text x="12" y="38" fill="#065f46" font-family="system-ui, sans-serif" font-size="10">Khuôn phân lý tưởng nhất, trơn láng, không đau rát.</text>
      <text x="12" y="54" fill="#047857" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">✓ Mục tiêu sức khỏe đường ruột vàng!</text>
    </g>
  </g>

  <!-- Right: Type 5, 6, 7 (Xu hướng tiêu chảy) & Đánh giá -->
  <g transform="translate(370, 68)">
    <rect width="320" height="315" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#bShadow)" />

    <!-- TYPE 5 -->
    <g transform="translate(15, 12)">
      <rect width="290" height="66" rx="6" fill="#fff7ed" stroke="#fdba74" />
      <text x="12" y="20" fill="#c2410c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 5: Mảnh mềm có góc cạnh rõ (Thiếu xơ)</text>
      <text x="12" y="38" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="10">Phân mềm, đứt đoạn, dễ đi, thường gặp sau bữa ăn nhiều mỡ.</text>
      <text x="12" y="52" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Cần bổ sung thêm chất xơ hòa tan để định hình phân.</text>
    </g>

    <!-- TYPE 6 -->
    <g transform="translate(15, 84)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 6: Mảnh xốp bèo nhèo (Tiêu chảy nhẹ)</text>
      <text x="12" y="38" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10">Phân sệt lỏng bấy nhầy, viền không rõ ràng.</text>
      <text x="12" y="52" fill="#991b1b" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Thường gặp ở đợt bùng phát IBS-D hoặc nhiễm khuẩn nhẹ.</text>
    </g>

    <!-- TYPE 7 -->
    <g transform="translate(15, 156)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="20" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Type 7: Hoàn toàn lỏng như nước (Tiêu chảy cấp)</text>
      <text x="12" y="38" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">Không còn mảnh đặc, nước toàn bộ, nguy cơ mất nước cao.</text>
      <text x="12" y="52" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">⚠ Cần bù nước Oresol khẩn cấp và đi khám nếu &gt; 2 ngày.</text>
    </g>

    <!-- Evaluation Box -->
    <g transform="translate(15, 230)">
      <rect width="290" height="72" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="145" y="22" fill="#1e293b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Ý Nghĩa Theo Dõi Trên GastroAI</text>
      <text x="12" y="42" fill="#475569" font-family="system-ui, sans-serif" font-size="10">• Ghi nhận Type phân hàng ngày giúp AI nhận diện xu hướng.</text>
      <text x="12" y="58" fill="#475569" font-family="system-ui, sans-serif" font-size="10">• Bác sĩ đánh giá hiệu quả thuốc nhuận tràng hoặc cầm tiêu chảy.</text>
    </g>
  </g>
</svg>

