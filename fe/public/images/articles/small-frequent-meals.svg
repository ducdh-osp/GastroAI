<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="mShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#mealBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#15803d" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    CHẾ ĐỘ CHIA NHỎ BỮA ĂN (5 - 6 BỮA) GIẢM TẢI CHO DẠ DÀY
  </text>

  <!-- Left: So sánh 3 bữa lớn vs 5-6 bữa nhỏ -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fef2f2" />
    <text x="160" y="32" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ❌ Sai Lầm Ăn 2 - 3 Bữa Quá No
    </text>

    <!-- Large meal overload diagram -->
    <g transform="translate(35, 55)">
      <!-- Overfilled stomach -->
      <path d="M 80 40 C 30 55, 10 100, 20 150 C 30 190, 80 200, 130 190 C 180 180, 200 130, 180 80 C 160 50, 110 35, 80 40 Z" fill="#fecdd3" stroke="#e11d48" stroke-width="2" />
      <text x="105" y="110" fill="#be123c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dạ dày quá tải</text>
      <text x="105" y="128" fill="#9f1239" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Căng giãn quá mức</text>

      <!-- Upward pressure arrow -->
      <path d="M 105 70 L 105 35" stroke="#dc2626" stroke-width="3" stroke-dasharray="3,2" />
      <polygon points="105,28 100,38 110,38" fill="#dc2626" />
    </g>

    <rect x="15" y="215" width="290" height="60" rx="6" fill="#fff1f2" stroke="#fecdd3" />
    <text x="160" y="235" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hậu quả ăn quá no một lần:</text>
    <text x="25" y="253" fill="#881337" font-family="system-ui, sans-serif" font-size="10.5">• Tăng áp lực trong dạ dày đẩy acid trào ngược lên ngực.</text>
    <text x="25" y="267" fill="#881337" font-family="system-ui, sans-serif" font-size="10.5">• Đầy bụng, khó tiêu, buồn nôn, mệt mỏi sau ăn.</text>
  </g>

  <!-- Right: Lịch trình 5 - 6 bữa nhỏ lý tưởng -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ecfdf5" />
    <text x="160" y="32" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ✓ Lịch Phân Bổ Bữa Nhỏ Hợp Lý
    </text>

    <!-- Schedule Items -->
    <g transform="translate(15, 50)">
      <rect width="290" height="36" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="23" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">07:00 - Bữa sáng vừa phải:</text>
      <text x="150" y="23" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">Cháo yến mạch, trứng luộc.</text>
    </g>

    <g transform="translate(15, 92)">
      <rect width="290" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="23" fill="#0d9488" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">09:30 - Bữa phụ 1:</text>
      <text x="135" y="23" fill="#334155" font-family="system-ui, sans-serif" font-size="11">1 quả chuối chín hoặc sữa chua.</text>
    </g>

    <g transform="translate(15, 134)">
      <rect width="290" height="36" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="23" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">12:00 - Bữa trưa cân đối:</text>
      <text x="145" y="23" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">Cơm mềm, cá hấp, canh rau ngót.</text>
    </g>

    <g transform="translate(15, 176)">
      <rect width="290" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="23" fill="#0d9488" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">15:30 - Bữa phụ 2:</text>
      <text x="135" y="23" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Bánh quy nguyên cám, trà thảo mộc.</text>
    </g>

    <g transform="translate(15, 218)">
      <rect width="290" height="58" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="20" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">18:30 - Bữa tối nhẹ nhàng:</text>
      <text x="12" y="36" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">Ăn trước giờ ngủ ít nhất 3 tiếng. Hạn chế dầu mỡ.</text>
      <text x="12" y="50" fill="#047857" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Dạ dày có đủ thời gian làm rỗng trước khi nằm.</text>
    </g>
  </g>
</svg>

