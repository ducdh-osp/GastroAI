<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="mdShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#medBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#7e22ce" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    THỜI ĐIỂM VÀNG UỐNG THUỐC TIÊU HÓA &amp; NGUYÊN TẮC TUÂN THỦ
  </text>

  <!-- Left: Thời điểm uống chuẩn -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mdShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f3e8ff" />
    <text x="160" y="32" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⏰ Thời Điểm Dùng 3 Nhóm Thuốc Chính
    </text>

    <!-- Group 1: PPI -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fdf4ff" stroke="#d8b4fe" />
      <text x="12" y="19" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">1. Nhóm PPI (Omeprazole, Esomeprazole...)</text>
      <text x="12" y="35" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Uống 30-60 phút TRƯỚC ăn sáng (hoặc tối nếu 2 lần).</tspan>
        <tspan x="12" dy="14" fill="#6b21a8" font-style="italic">Bơm acid hoạt động mạnh khi ăn, thuốc cần ngấm trước.</tspan>
      </text>
    </g>

    <!-- Group 2: Antacids -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="12" y="19" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">2. Kháng acid dạng gói/sữa (Antacid, Gaviscon)</text>
      <text x="12" y="35" fill="#1e40af" font-family="system-ui, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Uống 1-2 tiếng SAU ăn hoặc ngay khi đau/ợ nóng.</tspan>
        <tspan x="12" dy="14" fill="#1d4ed8" font-style="italic">Trung hòa acid tức thời và tạo màng ngăn trào ngược.</tspan>
      </text>
    </g>

    <!-- Group 3: Probiotics -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="19" fill="#047857" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">3. Men vi sinh (Probiotics) &amp; Kháng sinh</text>
      <text x="12" y="35" fill="#065f46" font-family="system-ui, sans-serif" font-size="9.5">
        <tspan x="12" dy="0">Đang uống kháng sinh diệt HP: uống men CÁCH 2 GIỜ.</tspan>
        <tspan x="12" dy="14" fill="#047857" font-style="italic">Tránh để kháng sinh diệt luôn lợi khuẩn đường ruột.</tspan>
      </text>
    </g>
  </g>

  <!-- Right: 3 Nguyên tắc tuân thủ -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mdShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f8fafc" />
    <text x="160" y="32" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🛡 3 Lưu Ý Sống Còn Khi Dùng Thuốc
    </text>

    <!-- Rule 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">KHÔNG TỰ Ý BỎ THUỐC KHI VỪA HẾT ĐAU</text>
      <text x="12" y="37" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="12" dy="0">Ổ loét niêm mạc cần 4-8 tuần để lành hẳn.</tspan>
        <tspan x="12" dy="14">Ngừng sớm khiến bệnh tái phát và kháng thuốc.</tspan>
      </text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" />
      <text x="12" y="20" fill="#b45309" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">UỐNG NGUYÊN VIÊN VỚI NHIỀU NƯỚC LỌC</text>
      <text x="12" y="37" fill="#78350f" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="12" dy="0">Không nhai, bẻ viên bao tan trong ruột.</tspan>
        <tspan x="12" dy="14">Tránh uống cùng sữa, nước có ga hoặc bưởi.</tspan>
      </text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
      <text x="12" y="20" fill="#047857" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">SỬ DỤNG TÍNH NĂNG NHẮC UỐNG THUỐC</text>
      <text x="12" y="37" fill="#065f46" font-family="system-ui, sans-serif" font-size="10">
        <tspan x="12" dy="0">Cài đặt giờ uống cố định trên GastroAI</tspan>
        <tspan x="12" dy="14">để không quên liều và giữ hiệu quả điều trị.</tspan>
      </text>
    </g>
  </g>
</svg>

