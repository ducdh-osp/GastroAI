<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="mdShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#medBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#7e22ce" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    THỜI ĐIỂM VÀNG UỐNG THUỐC TIÊU HÓA &amp; NGUYÊN TẮC TUÂN THỦ
  </text>

  <!-- Left: Thời điểm uống chuẩn -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mdShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f3e8ff" />
    <text x="160" y="32" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⏰ Thời Điểm Dùng 3 Nhóm Thuốc Chính
    </text>

    <!-- Group 1: PPI -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fdf4ff" stroke="#d8b4fe" />
      <text x="12" y="22" fill="#7e22ce" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Thuốc ức chế bơm Proton (PPI - Omeprazole, Esomeprazole...)</text>
      <text x="12" y="40" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5">Uống 30 - 60 phút TRƯỚC bữa ăn sáng (hoặc bữa tối nếu uống 2 lần).</text>
      <text x="12" y="54" fill="#6b21a8" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Bơm acid hoạt động mạnh nhất khi ăn, thuốc cần ngấm trước.</text>
    </g>

    <!-- Group 2: Antacids -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="12" y="22" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Thuốc kháng acid dạng sữa / gói (Antacid, Gaviscon...)</text>
      <text x="12" y="40" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10.5">Uống 1 - 2 tiếng SAU bữa ăn hoặc ngay khi có cơn đau/ợ nóng.</text>
      <text x="12" y="54" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Tác dụng trung hòa acid tức thời và tạo màng ngăn trào ngược.</text>
    </g>

    <!-- Group 3: Probiotics -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Men vi sinh (Probiotics) &amp; Kháng sinh</text>
      <text x="12" y="40" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">Nếu có kháng sinh diệt HP, uống men vi sinh CÁCH 2 TIẾNG.</text>
      <text x="12" y="54" fill="#047857" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic">Tránh để kháng sinh tiêu diệt luôn vi khuẩn có lợi của men.</text>
    </g>
  </g>

  <!-- Right: 3 Nguyên tắc tuân thủ -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mdShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f8fafc" />
    <text x="160" y="32" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🛡 3 Lưu Ý Sống Còn Khi Dùng Thuốc
    </text>

    <!-- Rule 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="22" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">KHÔNG TỰ Ý BỎ THUỐC KHI VỪA HẾT ĐAU</text>
      <text x="12" y="40" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10.5">Vết loét niêm mạc cần 4-8 tuần để lành sẹo hoàn toàn. Dừng sớm khiến bệnh tái phát và tăng nguy cơ kháng thuốc.</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" />
      <text x="12" y="22" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">UỐNG NGUYÊN VIÊN VỚI NHIỀU NƯỚC LỌC</text>
      <text x="12" y="40" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">Không nhai, bẻ hoặc nghiền viên bao tan trong ruột. Không uống cùng sữa, nước ngọt có ga hay nước bưởi.</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#ecfdf5" stroke="#6ee7b7" />
      <text x="12" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">SỬ DỤNG TÍNH NĂNG NHẮC UỐNG THUỐC</text>
      <text x="12" y="40" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">Cài đặt giờ uống cố định trên ứng dụng GastroAI để không quên liều, hỗ trợ theo dõi tỷ lệ tuân thủ điều trị.</text>
    </g>
  </g>
</svg>

