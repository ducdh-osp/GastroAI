<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="diarrheaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="dShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#diarrheaBg)" />

  <!-- Header -->
  <rect x="24" y="20" width="672" height="44" rx="8" fill="#1d4ed8" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    TIÊU CHẢY: NGUYÊN TẮC BÙ NƯỚC ORESOL &amp; CẢNH BÁO MẤT NƯỚC
  </text>

  <!-- Left: Pha Oresol chuẩn -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#dbeafe" />
    <text x="160" y="32" fill="#1e40af" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      💧 Nguyên Tắc Bù Dịch Bằng Oresol
    </text>

    <!-- Oresol Packet & Water Glass -->
    <g transform="translate(40, 55)">
      <!-- Packet -->
      <rect x="0" y="20" width="65" height="90" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5" />
      <text x="32" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">GÓI</text>
      <text x="32" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ORESOL</text>
      <circle cx="32" cy="90" r="4" fill="#93c5fd" />

      <!-- Arrow -->
      <text x="95" y="75" fill="#2563eb" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">+</text>

      <!-- Water Pitcher / Bottle -->
      <rect x="135" y="10" width="80" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
      <rect x="137" y="40" width="76" height="78" rx="8" fill="#38bdf8" opacity="0.6" />
      <text x="175" y="80" fill="#0369a1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Đúng thể tích</text>
      <text x="175" y="96" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">(1000ml / 200ml)</text>
    </g>

    <!-- Guidance notes -->
    <rect x="15" y="180" width="290" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="25" y="202" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">✓ Pha đúng lượng nước quy định trên bao bì</text>
    <text x="25" y="222" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Không pha quá đặc (gây ngộ độc muối).</text>
    <text x="25" y="242" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Uống từng ngụm nhỏ, uống rải rác sau mỗi lần đi ngoài.</text>
    <text x="25" y="262" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="600">• Dung dịch đã pha chỉ uống trong 24 giờ.</text>
  </g>

  <!-- Right: 3 Cấp độ mất nước -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f8fafc" />
    <text x="160" y="32" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🚨 3 Mức Độ Mất Nước Cần Theo Dõi
    </text>

    <!-- Level 1: Nhẹ -->
    <g transform="translate(15, 52)">
      <rect width="290" height="64" rx="8" fill="#f0fdf4" stroke="#86efac" />
      <text x="15" y="24" fill="#15803d" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">1. Mất nước nhẹ: Theo dõi tại nhà</text>
      <text x="15" y="42" fill="#166534" font-family="system-ui, sans-serif" font-size="11">Khát nước, môi khô nhẹ, nước tiểu vàng sẫm.</text>
      <text x="15" y="56" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Xử trí: Tích cực uống Oresol và nước lọc bù dịch.</text>
    </g>

    <!-- Level 2: Trung bình -->
    <g transform="translate(15, 126)">
      <rect width="290" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d" />
      <text x="15" y="24" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">2. Mất nước vừa: Khám sớm</text>
      <text x="15" y="42" fill="#92400e" font-family="system-ui, sans-serif" font-size="11">Mắt trũng, da nhăn nheo véo da chậm đàn hồi.</text>
      <text x="15" y="56" fill="#78350f" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Tiểu ít hoặc không tiểu trong 6 giờ, mệt lả.</text>
    </g>

    <!-- Level 3: Nặng (Cấp cứu) -->
    <g transform="translate(15, 200)">
      <rect width="290" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="15" y="24" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">3. Mất nước nặng: CẤP CỨU NGAY (115)</text>
      <text x="15" y="42" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11">Lơ mơ, mê sảng, mạch nhanh nhỏ, huyết áp tụt.</text>
      <text x="15" y="56" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Cần truyền dịch tĩnh mạch tại bệnh viện khẩn cấp!</text>
    </g>
  </g>
</svg>

