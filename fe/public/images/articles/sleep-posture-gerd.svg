<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sleepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="slShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#sleepBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#4338ca" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    TƯ THẾ NGỦ CHUẨN GIẢM TRÀO NGƯỢC DẠ DÀY BAN ĐÊM
  </text>

  <!-- Left: Nằm nghiêng bên trái (Đúng) -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#slShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ecfdf5" />
    <text x="160" y="32" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ✓ NẰM NGHIÊNG BÊN TRÁI (Tốt nhất)
    </text>

    <!-- Stomach Anatomical Position Left -->
    <g transform="translate(35, 50)">
      <!-- Bed Line -->
      <line x1="0" y1="130" x2="250" y2="130" stroke="#cbd5e1" stroke-width="2" />
      <!-- Pillow elevated -->
      <polygon points="10,130 50,130 45,95 10,110" fill="#e0e7ff" stroke="#a5b4fc" />

      <!-- Esophagus higher than stomach cavity -->
      <rect x="50" y="70" width="60" height="18" rx="4" fill="#fbcfe8" stroke="#f472b6" />
      <text x="80" y="83" fill="#be185d" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Thực quản</text>

      <!-- Stomach below on the left -->
      <path d="M 105 80 C 130 75, 170 85, 190 105 C 195 125, 150 130, 115 125 C 95 120, 100 95, 105 80 Z" fill="#fda4af" stroke="#e11d48" />
      <!-- Acid stays below level of esophagus -->
      <path d="M 115 110 C 140 108, 175 115, 185 120 C 175 130, 140 130, 115 125 Z" fill="#f59e0b" />
      <text x="150" y="122" fill="#78350f" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Acid dưới van</text>
    </g>

    <rect x="15" y="200" width="290" height="75" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="160" y="220" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cơ chế giải phẫu học:</text>
    <text x="25" y="238" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5">• Dạ dày nằm thấp hơn ngã ba thực quản.</text>
    <text x="25" y="254" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5">• Dịch vị acid được giữ trong phình vị, không trào ngược.</text>
    <text x="25" y="268" fill="#15803d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">✓ Giấc ngủ sâu, không bị đánh thức bởi ho hay rát ngực.</text>
  </g>

  <!-- Right: Nằm nghiêng bên phải & Nâng đầu giường -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#slShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fff1f2" />
    <text x="160" y="32" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ❌ NẰM NGHIÊNG PHẢI &amp; GỐI QUÁ THẤP
    </text>

    <!-- Stomach Anatomical Position Right -->
    <g transform="translate(35, 50)">
      <line x1="0" y1="130" x2="250" y2="130" stroke="#cbd5e1" stroke-width="2" />
      <polygon points="10,130 50,130 50,115 10,120" fill="#fee2e2" />

      <!-- Esophagus lower than stomach -->
      <rect x="50" y="95" width="60" height="18" rx="4" fill="#ffe4e6" stroke="#f43f5e" />

      <!-- Stomach higher on the right, acid floods down to esophagus -->
      <path d="M 105 85 C 130 65, 175 75, 185 95 C 190 115, 145 125, 110 115 Z" fill="#fda4af" stroke="#e11d48" />
      <!-- Acid leak arrow -->
      <path d="M 130 95 L 75 105" stroke="#dc2626" stroke-width="3" stroke-dasharray="3,2" />
      <polygon points="68,107 78,102 76,112" fill="#dc2626" />
      <text x="175" y="112" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">Acid tràn lên</text>
    </g>

    <rect x="15" y="200" width="290" height="75" rx="6" fill="#fff7ed" stroke="#fdba74" />
    <text x="160" y="220" fill="#c2410c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mẹo kê cao đầu giường 15 - 20 cm:</text>
    <text x="25" y="238" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">• Kê gối chống trào ngược hình nêm chữ V.</text>
    <text x="25" y="254" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">• Hoặc kê chân giường phía đầu cao lên 15cm.</text>
    <text x="25" y="268" fill="#c2410c" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold">Không chêm nhiều gối đầu (sẽ gập cổ gây khó thở).</text>
  </g>
</svg>

