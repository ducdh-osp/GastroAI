<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dehyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="dhShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#dehyBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#0284c7" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    NHẬN BIẾT DẤU HIỆU MẤT NƯỚC &amp; THANG MÀU NƯỚC TIỂU
  </text>

  <!-- Left: Thang đo màu nước tiểu -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dhShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#e0f2fe" />
    <text x="160" y="32" fill="#0369a1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🧪 Thang Màu Nước Tiểu Đánh Giá Bù Nước
    </text>

    <!-- Level 1: Clear/Pale yellow -->
    <g transform="translate(15, 52)">
      <rect width="35" height="46" rx="4" fill="#fef9c3" stroke="#fef08a" />
      <rect x="45" y="0" width="245" height="46" rx="4" fill="#f0fdf4" stroke="#bbf7d0" />
      <text x="55" y="20" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Màu 1 - 2: Vàng nhạt / Trong suốt</text>
      <text x="55" y="36" fill="#166534" font-family="system-ui, sans-serif" font-size="10">Cơ thể đủ nước hoàn hảo. Duy trì lượng nước hiện tại.</text>
    </g>

    <!-- Level 2: Dark yellow -->
    <g transform="translate(15, 106)">
      <rect width="35" height="46" rx="4" fill="#fde047" stroke="#eab308" />
      <rect x="45" y="0" width="245" height="46" rx="4" fill="#fffbeb" stroke="#fde68a" />
      <text x="55" y="20" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Màu 3 - 4: Vàng sẫm</text>
      <text x="55" y="36" fill="#92400e" font-family="system-ui, sans-serif" font-size="10">Mất nước nhẹ. Cần uống ngay 1 - 2 cốc nước lọc/Oresol.</text>
    </g>

    <!-- Level 3: Amber / Brown -->
    <g transform="translate(15, 160)">
      <rect width="35" height="46" rx="4" fill="#ca8a04" stroke="#a16207" />
      <rect x="45" y="0" width="245" height="46" rx="4" fill="#fef2f2" stroke="#fecdd3" />
      <text x="55" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Màu 5 - 6: Hổ phách / Nâu sậm</text>
      <text x="55" y="36" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">Mất nước nghiêm trọng! Uống Oresol và kiểm tra y tế.</text>
    </g>

    <rect x="15" y="218" width="290" height="56" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="160" y="238" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
      Tần suất đi tiểu bình thường: 4 - 6 lần/ngày
    </text>
    <text x="160" y="256" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">
      Nếu &gt; 6 tiếng không buồn tiểu: Dấu hiệu mất nước nguy hiểm!
    </text>
  </g>

  <!-- Right: 4 Dấu hiệu lâm sàng cảnh báo mất nước -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dhShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f8fafc" />
    <text x="160" y="32" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⚠️ 4 Dấu Hiệu Lâm Sàng Cần Lưu Ý
    </text>

    <!-- Sign 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="20" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Khô miệng &amp; Môi nứt nẻ</text>
      <text x="12" y="36" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="10">Nước bọt quánh đặc, họng khô rát, cảm giác khát cồn cào.</text>
    </g>

    <!-- Sign 2 -->
    <g transform="translate(15, 106)">
      <rect width="290" height="48" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="20" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Chóng mặt &amp; Choáng váng khi đứng dậy</text>
      <text x="12" y="36" fill="#78350f" font-family="system-ui, sans-serif" font-size="10">Tụt huyết áp tư thế do giảm thể tích tuần hoàn máu.</text>
    </g>

    <!-- Sign 3 -->
    <g transform="translate(15, 160)">
      <rect width="290" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
      <text x="12" y="20" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Mắt trũng &amp; Da mất tính đàn hồi</text>
      <text x="12" y="36" fill="#1e40af" font-family="system-ui, sans-serif" font-size="10">Khi véo da mu bàn tay thả ra, nếp véo da trở lại rất chậm.</text>
    </g>

    <!-- Sign 4 -->
    <g transform="translate(15, 214)">
      <rect width="290" height="56" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" />
      <text x="12" y="22" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4. Mệt lả, lú lẫn, thở nhanh gấp (Cấp cứu)</text>
      <text x="12" y="38" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10">Dấu hiệu sốc mất nước nguy hiểm tới tính mạng.</text>
    </g>
  </g>
</svg>

