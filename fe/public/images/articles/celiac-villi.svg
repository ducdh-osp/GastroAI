<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="celiacBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="cShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#celiacBg)" />

  <!-- Header -->
  <rect x="24" y="20" width="672" height="44" rx="8" fill="#0f766e" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    BỆNH CELIAC &amp; TỔN THƯƠNG NHUNG MAO RUỘT NON DO GLUTEN
  </text>

  <!-- Left: Nhung mao bình thường -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ecfdf5" />
    <text x="160" y="32" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ✓ Ruột Non Bình Thường (Khỏe mạnh)
    </text>

    <!-- Tall healthy villi fingers -->
    <g transform="translate(35, 60)">
      <!-- Villi 1 -->
      <path d="M 10 130 C 10 50, 35 50, 35 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />
      <!-- Villi 2 -->
      <path d="M 45 130 C 45 35, 75 35, 75 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />
      <!-- Villi 3 -->
      <path d="M 85 130 C 85 40, 115 40, 115 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />
      <!-- Villi 4 -->
      <path d="M 125 130 C 125 35, 155 35, 155 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />
      <!-- Villi 5 -->
      <path d="M 165 130 C 165 45, 195 45, 195 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />
      <!-- Villi 6 -->
      <path d="M 205 130 C 205 50, 230 50, 230 130" fill="#fbcfe8" stroke="#db2777" stroke-width="2" />

      <!-- Ruột Base -->
      <rect x="0" y="130" width="250" height="30" fill="#fda4af" />
    </g>

    <!-- Capillaries & Absorbed Nutrients -->
    <text x="160" y="235" fill="#0f766e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Nhung mao cao, ngón tay vươn dài
    </text>
    <rect x="15" y="246" width="290" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" />
    <text x="160" y="265" fill="#15803d" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Diện tích hấp thu lớn: Hấp thu tối đa Sắt, Canxi, Vitamin
    </text>
  </g>

  <!-- Right: Nhung mao bị teo ở bệnh Celiac -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fff1f2" />
    <text x="160" y="32" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⚠ Bệnh Celiac (Tổn thương do Gluten)
    </text>

    <!-- Flattened/atrophied villi -->
    <g transform="translate(35, 60)">
      <!-- Gluten molecules attack (dots/stars) -->
      <circle cx="50" cy="50" r="4" fill="#d97706" />
      <circle cx="110" cy="45" r="4" fill="#d97706" />
      <circle cx="170" cy="55" r="4" fill="#d97706" />
      <text x="125" y="35" fill="#b45309" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Phản ứng tự miễn với Gluten</text>

      <!-- Flat blunted surface -->
      <path d="M 10 130 Q 30 115 50 130 Q 70 120 90 130 Q 110 115 130 130 Q 150 120 170 130 Q 190 115 210 130 L 230 130" fill="none" stroke="#ef4444" stroke-width="3" />
      <rect x="0" y="130" width="250" height="30" fill="#fecdd3" />
    </g>

    <text x="160" y="235" fill="#dc2626" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Nhung mao bị teo xẹp, bề mặt phẳng lì
    </text>
    <rect x="15" y="246" width="290" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" />
    <text x="160" y="265" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Kém hấp thu: Thiếu máu, tiêu chảy kéo dài, sụt cân
    </text>
  </g>
</svg>

