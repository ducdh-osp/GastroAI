<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="habitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="hShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#habitBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#0d9488" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    THÓI QUEN SAU BỮA ĂN: NÊN LÀM VÀ NÊN TRÁNH CHO DẠ DÀY
  </text>

  <!-- Left: Nên làm (Do's) -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#hShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ecfdf5" />
    <text x="160" y="32" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ✓ NÊN LÀM SAU BỮA ĂN (Thói quen tốt)
    </text>

    <!-- Do 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Ngồi thẳng hoặc đứng nhẹ nhàng 30-60 phút</text>
      <text x="12" y="40" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">Trọng lực giúp thức ăn lưu lại trong dạ dày và đi xuống ruột non, không trào ngược lên thực quản.</text>
    </g>

    <!-- Do 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Đi dạo chậm rãi (10 - 15 phút)</text>
      <text x="12" y="40" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">Vận động nhẹ kích thích nhu động dạ dày, giảm đầy trướng hơi và cải thiện chuyển hóa đường huyết.</text>
    </g>

    <!-- Do 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#f0fdf4" stroke="#a7f3d0" />
      <text x="12" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Mặc quần áo thoải mái, nới lỏng cạp quần</text>
      <text x="12" y="40" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5">Tránh thắt lưng quá chật gây ép ổ bụng, tăng áp lực đẩy dịch acid lên ngực.</text>
    </g>
  </g>

  <!-- Right: Không nên làm (Don'ts) -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#hShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fff1f2" />
    <text x="160" y="32" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ❌ CẦN TRÁNH NGAY SAU BỮA ĂN
    </text>

    <!-- Don't 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="22" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. NẰM NGAY HOẶC ĐI NGỦ LIỀN</text>
      <text x="12" y="40" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10.5">Mất tác dụng của trọng lực, cơ thắt LES bị acid tràn vào gây ợ nóng dữ dội và viêm thực quản.</text>
    </g>

    <!-- Don't 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fcd34d" />
      <text x="12" y="22" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. TẬP THỂ DỤC MẠNH, CHẠY NHẢY, GẬP BỤNG</text>
      <text x="12" y="40" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">Máu dồn về cơ bắp thay vì hệ tiêu hóa, dạ dày rung lắc gây xóc bụng, buồn nôn và nôn trớ.</text>
    </g>

    <!-- Don't 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#fef2f2" stroke="#fca5a5" />
      <text x="12" y="22" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. HÚT THUỐC LÁ &amp; UỐNG TRÀ ĐẬM / CÀ PHÊ</text>
      <text x="12" y="40" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10.5">Nicotine và caffeine làm giãn nhão cơ thắt LES, kích thích dạ dày tăng tiết acid mạnh.</text>
    </g>
  </g>
</svg>

