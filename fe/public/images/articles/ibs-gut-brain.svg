<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ibsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#ibsBg)" />

  <!-- Header -->
  <rect x="24" y="20" width="672" height="44" rx="8" fill="#047857" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    HỘI CHỨNG RUỘT KÍCH THÍCH (IBS) &amp; TRỤC NÃO - RUỘT
  </text>

  <!-- Left: Trục Não - Ruột -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ecfdf5" />
    <text x="160" y="32" fill="#065f46" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🧠 Trục Não - Ruột (Gut-Brain Axis)
    </text>

    <!-- Brain Icon / Symbol -->
    <rect x="110" y="55" width="100" height="45" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="160" y="75" fill="#3730a3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Não bộ (CNS)</text>
    <text x="160" y="90" fill="#6366f1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Stress • Lo âu • Cảm xúc</text>

    <!-- Bidirectional Arrows -->
    <path d="M 140 108 L 140 148" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4,3" />
    <polygon points="140,154 135,145 145,145" fill="#0d9488" />
    <path d="M 180 148 L 180 108" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4,3" />
    <polygon points="180,102 175,111 185,111" fill="#6366f1" />

    <text x="235" y="130" fill="#0d9488" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Dây thần kinh</text>
    <text x="235" y="142" fill="#0d9488" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Phế vị &amp; Tín hiệu</text>

    <!-- Gut Icon / Symbol -->
    <rect x="90" y="160" width="140" height="50" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="1.5" />
    <text x="160" y="180" fill="#065f46" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Đại tràng &amp; Ruột (ENS)</text>
    <text x="160" y="196" fill="#047857" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Tăng nhạy cảm • Co thắt</text>

    <!-- Key Insights -->
    <rect x="15" y="222" width="290" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="25" y="240" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Không có tổn thương viêm loét thực thể.</text>
    <text x="25" y="258" fill="#334155" font-family="system-ui, sans-serif" font-size="11">• Triệu chứng liên quan mật thiết tới tâm lý.</text>
  </g>

  <!-- Right: 3 Phân Nhóm Thường Gặp Của IBS -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f0fdfa" />
    <text x="160" y="32" fill="#0f766e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      📋 3 Thể Phân Loại Lâm Sàng (Rome IV)
    </text>

    <!-- Card IBS-D -->
    <g transform="translate(15, 52)">
      <rect width="290" height="64" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
      <text x="15" y="24" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">IBS-D (Thể tiêu chảy)</text>
      <text x="15" y="42" fill="#7f1d1d" font-family="system-ui, sans-serif" font-size="11">Phân lỏng, đi ngoài nhiều lần sau ăn hoặc stress.</text>
      <text x="15" y="55" fill="#991b1b" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Thường gặp mót rặn, đau bụng giảm sau khi đại tiện.</text>
    </g>

    <!-- Card IBS-C -->
    <g transform="translate(15, 126)">
      <rect width="290" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1" />
      <text x="15" y="24" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">IBS-C (Thể táo bón)</text>
      <text x="15" y="42" fill="#92400e" font-family="system-ui, sans-serif" font-size="11">Phân cứng, khô viên, đại tiện &lt; 3 lần/tuần.</text>
      <text x="15" y="55" fill="#78350f" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Cảm giác đi chưa hết phân, đầy trướng bụng dưới.</text>
    </g>

    <!-- Card IBS-M -->
    <g transform="translate(15, 200)">
      <rect width="290" height="64" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1" />
      <text x="15" y="24" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">IBS-M (Thể hỗn hợp)</text>
      <text x="15" y="42" fill="#5b21b6" font-family="system-ui, sans-serif" font-size="11">Xen kẽ các đợt tiêu chảy và táo bón thất thường.</text>
      <text x="15" y="55" fill="#4c1d95" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Cần chế độ ăn Low-FODMAP và quản lý stress.</text>
    </g>
  </g>
</svg>

