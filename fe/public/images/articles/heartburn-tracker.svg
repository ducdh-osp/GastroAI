<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="htBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="htShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#htBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#ea580c" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    NHẬT KÝ THEO DÕI Ợ NÓNG 30 NGÀY &amp; CÁC YẾU TỐ KÍCH HOẠT
  </text>

  <!-- Left: Nhật ký theo dõi -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#htShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ffedd5" />
    <text x="160" y="32" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      📝 4 Thông Tin Vàng Cần Ghi Nhật Ký
    </text>

    <!-- Point 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="48" rx="6" fill="#fff7ed" stroke="#fed7aa" />
      <text x="12" y="20" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. Thời điểm xuất hiện</text>
      <text x="12" y="36" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="10">Sau bữa ăn 30-60 phút? Nửa đêm khi nằm ngủ?</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(15, 106)">
      <rect width="290" height="48" rx="6" fill="#fff7ed" stroke="#fed7aa" />
      <text x="12" y="20" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. Món ăn/đồ uống trước đó</text>
      <text x="12" y="36" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="10">Đồ chiên xào, cà phê, rượu bia, tỏi ớt, sô-cô-la?</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(15, 160)">
      <rect width="290" height="48" rx="6" fill="#fff7ed" stroke="#fed7aa" />
      <text x="12" y="20" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. Mức độ khó chịu (Thang 1 - 10)</text>
      <text x="12" y="36" fill="#7c2d12" font-family="system-ui, sans-serif" font-size="10">Nhẹ thoáng qua hay rát bỏng gây tỉnh giấc?</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(15, 214)">
      <rect width="290" height="56" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
      <text x="12" y="22" fill="#065f46" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4. Yếu tố làm giảm</text>
      <text x="12" y="38" fill="#047857" font-family="system-ui, sans-serif" font-size="10">Uống nước ấm, ngồi thẳng dậy hay dùng thuốc kháng acid?</text>
    </g>
  </g>

  <!-- Right: Lợi ích theo dõi 30 ngày -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#htShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f0fdfa" />
    <text x="160" y="32" fill="#0f766e" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🎯 Lợi Ích Cho Bác Sĩ &amp; Bệnh Nhân
    </text>

    <!-- Benefit 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="64" rx="8" fill="#f0fdfa" stroke="#99f6e4" />
      <text x="15" y="24" fill="#0f766e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Xác định chính xác thực phẩm kích hoạt</text>
      <text x="15" y="44" fill="#115e59" font-family="system-ui, sans-serif" font-size="11">Mỗi người có độ nhạy cảm khác nhau, ghi nhật ký giúp kiêng đúng món gây bệnh mà không cần ăn kiêng quá mức.</text>
    </g>

    <!-- Benefit 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="15" y="24" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Dữ liệu thực tế cho bác sĩ điều trị</text>
      <text x="15" y="44" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Cung cấp bằng chứng cụ thể về tần suất và thời điểm giúp bác sĩ kê đơn và chỉnh liều thuốc PPI tối ưu.</text>
    </g>

    <!-- Benefit 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="64" rx="8" fill="#fef2f2" stroke="#fecdd3" />
      <text x="15" y="24" fill="#be123c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Phát hiện sớm dấu hiệu kháng trị</text>
      <text x="15" y="44" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11">Nếu sau 4-8 tuần tuân thủ thuốc mà triệu chứng không giảm, cần chỉ định nội soi hoặc đo pH thực quản 24h.</text>
    </g>
  </g>
</svg>

