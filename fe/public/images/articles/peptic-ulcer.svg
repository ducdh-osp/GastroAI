<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ulcerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="uShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#ulcerBg)" />

  <!-- Header -->
  <rect x="24" y="20" width="672" height="44" rx="8" fill="#b91c1c" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    LOÉT DẠ DÀY - TÁ TRÀNG &amp; MẤT CÂN BẰNG TẤN CÔNG - BẢO VỆ
  </text>

  <!-- Left: Sơ đồ vị trí ổ loét -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#uShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fef2f2" />
    <text x="160" y="32" fill="#991b1b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      📍 Vị Trí Thường Gặp Của Ổ Loét
    </text>

    <!-- Stomach Outline -->
    <path d="M 160 55 C 160 80, 140 100, 120 120 C 90 150, 70 190, 80 230 C 95 270, 150 280, 200 260 C 250 235, 270 170, 230 110 C 210 80, 190 60, 180 55 Z" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2.5" />

    <!-- Duodenum (Tá tràng) -->
    <path d="M 120 235 C 110 250, 95 265, 90 280 C 85 295, 110 305, 135 295" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round" />
    <text x="45" y="300" fill="#9f1239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Hành tá tràng</text>
    <line x1="85" y1="285" x2="115" y2="285" stroke="#e11d48" stroke-width="1.5" />

    <!-- Ulcer Spot in Duodenum -->
    <circle cx="100" cy="270" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <circle cx="100" cy="270" r="11" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="35" y="265" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Ổ loét tá tràng</text>

    <!-- Ulcer Spot in Lesser Curvature (Dạ dày) -->
    <circle cx="140" cy="165" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <circle cx="140" cy="165" r="13" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="180" y="165" fill="#dc2626" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Ổ loét dạ dày</text>
    <text x="180" y="180" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">(Bờ cong nhỏ)</text>
    <line x1="150" y1="165" x2="175" y2="165" stroke="#dc2626" stroke-width="1.5" />

    <text x="160" y="125" fill="#475569" font-family="system-ui, sans-serif" font-size="11">Thân dạ dày</text>

    <rect x="15" y="246" width="290" height="30" rx="6" fill="#f8fafc" />
    <text x="160" y="265" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">
      Tổn thương ăn sâu qua lớp niêm mạc vào lớp cơ
    </text>
  </g>

  <!-- Right: Thuyết Cân Bằng Yếu Tố Tấn Công vs Bảo Vệ -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#uShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#f8fafc" />
    <text x="160" y="32" fill="#1e293b" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ⚖ Cơ Chế Bệnh Sinh (Cán Cân Shay)
    </text>

    <!-- Aggressive Factors (Tấn công) -->
    <g transform="translate(15, 52)">
      <rect width="290" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" />
      <text x="15" y="22" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
        ⚔ Yếu Tố TẤN CÔNG (Tăng cao)
      </text>
      <text x="15" y="42" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11">• Acid dịch vị HCl &amp; Men Pepsin</text>
      <text x="15" y="60" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11">• Nhiễm vi khuẩn Helicobacter pylori</text>
      <text x="15" y="78" fill="#991b1b" font-family="system-ui, sans-serif" font-size="11">• Thuốc kháng viêm không steroid (NSAID)</text>
    </g>

    <!-- Defensive Factors (Bảo vệ) -->
    <g transform="translate(15, 160)">
      <rect width="290" height="95" rx="8" fill="#ecfdf5" stroke="#86efac" />
      <text x="15" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
        🛡 Yếu Tố BẢO VỆ (Bị suy giảm)
      </text>
      <text x="15" y="42" fill="#065f46" font-family="system-ui, sans-serif" font-size="11">• Lớp chất nhầy Mucus &amp; Bicarbonate (HCO3-)</text>
      <text x="15" y="60" fill="#065f46" font-family="system-ui, sans-serif" font-size="11">• Lưu lượng máu tưới nuôi niêm mạc</text>
      <text x="15" y="78" fill="#065f46" font-family="system-ui, sans-serif" font-size="11">• Tái tạo tế bào biểu mô &amp; Prostaglandin</text>
    </g>

    <text x="160" y="275" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      ➔ Mất cân bằng dẫn đến loét thủng niêm mạc
    </text>
  </g>
</svg>

