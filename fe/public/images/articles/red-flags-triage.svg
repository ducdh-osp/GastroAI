<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="rfShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="720" height="400" rx="16" fill="url(#rfBg)" />

  <rect x="24" y="20" width="672" height="44" rx="8" fill="#be123c" />
  <text x="360" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    🚨 CÁC DẤU HIỆU BÁO ĐỘNG ĐỎ (RED FLAGS) BỆNH TIÊU HÓA
  </text>

  <!-- Left: 3 Dấu hiệu cấp cứu khẩn cấp (Gọi 115) -->
  <g transform="translate(30, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#rfShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#ffe4e6" />
    <text x="160" y="32" fill="#9f1239" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🚑 CẤP CỨU NGAY LẬP TỨC (GỌI 115)
    </text>

    <!-- Emergency 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" />
      <text x="12" y="22" fill="#be123c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. NÔN RA MÁU / NÔN DỊCH BÃ CÀ PHÊ</text>
      <text x="12" y="40" fill="#881337" font-family="system-ui, sans-serif" font-size="10.5">Dấu hiệu xuất huyết tiêu hóa trên do loét dạ dày hoặc vỡ giãn tĩnh mạch thực quản. Cần cầm máu khẩn cấp!</text>
    </g>

    <!-- Emergency 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" />
      <text x="12" y="22" fill="#be123c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. ĐI NGOÀI PHÂN ĐEN NHƯ HẮC ÍN / MÁU TƯƠI</text>
      <text x="12" y="40" fill="#881337" font-family="system-ui, sans-serif" font-size="10.5">Phân đen sệt, mùi khắm tanh đặc trưng, biểu hiện mất máu đường tiêu hóa cấp tính đe dọa trụy mạch.</text>
    </g>

    <!-- Emergency 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#fff1f2" stroke="#fda4af" />
      <text x="12" y="22" fill="#be123c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. ĐAU BỤNG DỮ DỘI, BỤNG CỨNG NHƯ GỖ</text>
      <text x="12" y="40" fill="#881337" font-family="system-ui, sans-serif" font-size="10.5">Cảnh báo thủng ổ loét dạ dày - tá tràng hoặc viêm ruột thừa cấp, viêm tụy cấp cần phẫu thuật cấp cứu.</text>
    </g>
  </g>

  <!-- Right: 3 Dấu hiệu cần khám chuyên khoa sớm -->
  <g transform="translate(370, 80)">
    <rect width="320" height="290" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#rfShadow)" />
    <rect x="15" y="14" width="290" height="26" rx="13" fill="#fffbeb" />
    <text x="160" y="32" fill="#b45309" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      🏥 CẦN ĐI KHÁM BÁC SĨ CHUYÊN KHOA SỚM
    </text>

    <!-- Early sign 1 -->
    <g transform="translate(15, 52)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="22" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">1. SỤT CÂN NHANH KHÔNG RÕ NGUYÊN NHÂN</text>
      <text x="12" y="40" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">Giảm &gt; 5% trọng lượng cơ thể trong 1-3 tháng không do ăn kiêng, kèm chán ăn, người gầy sút xanh xao.</text>
    </g>

    <!-- Early sign 2 -->
    <g transform="translate(15, 126)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="22" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">2. KHÓ NUỐT HOẶC NUỐT ĐAU TĂNG DẦN</text>
      <text x="12" y="40" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">Thức ăn đặc bị mắc nghẹn ở ngực, sau đó nghẹn cả thức ăn lỏng. Cần nội soi thực quản tầm soát u/chít hẹp.</text>
    </g>

    <!-- Early sign 3 -->
    <g transform="translate(15, 200)">
      <rect width="290" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" />
      <text x="12" y="22" fill="#b45309" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">3. THIẾU MÁU, THAY ĐỔI KHUÔN PHÂN Ở TUỔI &gt; 50</text>
      <text x="12" y="40" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5">Táo bón hoặc tiêu chảy mới xuất hiện kéo dài, khuôn phân dẹt nhỏ như chiếc đũa cần nội soi toàn bộ đại tràng.</text>
    </g>
  </g>
</svg>

